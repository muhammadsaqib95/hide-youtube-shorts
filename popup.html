<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Skipped ads</title>
    <style>
      body {
        margin: 0;
        min-width: 220px;
        font-family: system-ui, sans-serif;
        color: #202124;
        background: #fff;
      }
      main {
        padding: 16px 18px 14px;
      }
      p {
        margin: 0;
        font-size: 13px;
        color: #5f6368;
      }
      strong {
        display: block;
        margin-top: 4px;
        font-size: 32px;
        line-height: 1.1;
        color: #202124;
      }
      button {
        margin-top: 14px;
        border: 0;
        background: transparent;
        color: #1a73e8;
        font: inherit;
        font-size: 12px;
        padding: 0;
        cursor: pointer;
      }
      label {
        display: flex;
        gap: 8px;
        align-items: flex-start;
        margin-top: 16px;
        padding-top: 14px;
        border-top: 1px solid #e8eaed;
        font-size: 13px;
        font-weight: 600;
        line-height: 1.35;
        cursor: pointer;
      }
      .hint {
        margin: 6px 0 0 22px;
        font-size: 12px;
        font-weight: 400;
        color: #5f6368;
      }
      input {
        margin-top: 2px;
      }
    </style>
  </head>
  <body>
    <main>
      <p>Google ads skipped</p>
      <strong id="count">0</strong>
      <button id="reset" type="button">Reset count</button>
      <label>
        <input id="dumb-youtube" type="checkbox" />
        <span>Dumb YouTube</span>
      </label>
      <p class="hint">Hides the home feed, subscriptions, and watch-page suggestions. Search and watching stay available.</p>
    </main>
    <script src="popup.js"></script>
  </body>
</html>
